aid: zoho-campaigns
name: Zoho Campaigns
description: >-
  Zoho Campaigns is Zoho Corporation's email marketing platform, and it exposes
  two distinct public API surfaces. The Zoho Campaigns API v1.1 is an
  RPC-over-HTTP interface for campaigns, mailing lists, contacts, segments,
  custom fields, merge tags, coupons, topics and automation workflows,
  authenticated with OAuth 2.0 against Zoho Accounts and returning JSON or XML
  selected with a resfmt query parameter. The Zoho Campaigns Email API v2 is a
  separate resource-oriented JSON REST API for transactional and bulk sending —
  transmissions, stored templates, recipient lists, suppression lists, sending
  and tracking domains, users, licensing, delivery reports and event webhooks —
  authenticated with an API key. Zoho publishes no OpenAPI for either surface;
  the machine-readable contract it does publish is a first-party Postman
  collection for the Email API.
