apis:
  - name: Zoho Campaigns API
    description: >-
      REST API for managing email campaigns, mailing lists, subscribers,
      templates, and analytics in Zoho Campaigns. Supports campaign creation,
      scheduling, sending, cloning, and reporting as well as contact and list
      management.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://www.zoho.com/campaigns/help/developers/
    baseURL: https://campaigns.zoho.com/api/v1.1/
    tags:
      - Email Marketing
      - Campaigns
      - Mailing Lists
      - Subscribers
      - Email Templates
      - A/B Testing
      - Campaign Analytics
    properties:
      - type: Documentation
        url: https://www.zoho.com/campaigns/help/developers/
      - type: Authentication
        url: https://www.zoho.com/campaigns/help/developers/access-token.html
      - type: APIReference
        url: https://www.zoho.com/campaigns/help/developers/campaign-management.html
      - type: JSONLD
        url: json-ld/zoho-campaigns.json
  - name: Zoho Campaigns Email API
    description: >-
      Resource-oriented JSON REST API for sending email at volume from Zoho
      Campaigns. Covers transmissions (create, schedule, reschedule, cancel,
      fetch), stored HTML/text templates, recipient lists, the suppression list,
      sending and bounce domains, tracking domains, webhook subscriptions,
      delivery and event reports (open, click, bounce, spam), user management
      and license details. Version 2 authenticates with an API key sent as
      "Authorization: Zoho-zapikey"; the still-published version 1 uses the same
      resource tree with Zoho OAuth 2.0 tokens.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://www.zoho.com/campaigns/help/emailapi/overview.html
    baseURL: https://campaigns.zoho.com/emailapi/v2/
    tags:
