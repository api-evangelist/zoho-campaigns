name: Zoho Campaigns error code catalog
format: vendor-numeric
note: >-
  Zoho Campaigns does NOT use RFC 9457 problem+json. Both surfaces return a
  vendor envelope carrying a numeric `code` plus a human `message`; the v1.1
  Campaigns API wraps it in a <response uri=... version=...> element for
  resfmt=XML and the equivalent JSON object for resfmt=JSON. The tables below
  are transcribed verbatim from the two published error-code references.
envelopes:
  - api: Zoho Campaigns API v1.1
    shape: >-
      {"code": <numeric>, "message": "<text>", "uri": "/api/v1.1/<method>",
      "version": "1", "status": "<success|error>"}
    xml_root: response
    code_field: code
    message_field: message
    observed: >-
      Live unauthenticated GET of https://campaigns.zoho.com/api/v1.1/openapi.json
      returned HTTP 200 with <response uri="/api/v1.1/openapi.json" version="1">
      <code>1004</code> — "Wrong URL entered."
    note: >-
      The v1.1 API returns HTTP 200 with an in-body error code rather than a
      4xx status, so agents MUST read the body `code`, not the HTTP status.
  - api: Zoho Campaigns Email API v2
    shape: '{"status": "<success|error>", "code": <6-digit>, "message": "<text>"}'
    code_field: code
    message_field: message
    code_classes:
      - prefix: '2xxxxx'
        meaning: Success
      - prefix: '4xxxxx'
        meaning: Failure due to client side error
      - prefix: '5xxxxx'
        meaning: Failure due to server side error
