identifiers:
  style: opaque numeric strings, 16-19 digits, Zoho-org-prefixed
  examples:
    - 1093639000422588023   # transmission_id
    - 214548000000287005    # webhook_id
    - 1314909000000144100   # contact_id
  note: >-
    Zoho Campaigns v1.1 additionally uses two user-generated opaque handles that
    are NOT numeric ids and must be fetched from the UI or a list call —
    `listkey` (per mailing list, generated under Contacts > Manage Lists >
    Setup) and `campaignkey`. An agent cannot construct either.
