name: Zoho Campaigns data model
description: >-
  Entity/relationship graph for the two Zoho Campaigns API surfaces. Derived
  from the provider's own published Postman collection (real request bodies and
  path shapes) and the developer-guide method tables — NOT from an OpenAPI,
  because Zoho publishes none for this product. Field names below are quoted
